name: dadg-agent
version: 0.3.1
description: DellarteDellaGuerra layer on top of bannerlord-agent - project context, DADG settings, Scotland placement skill and the DADG knowledge brain.
type: hybrid
targets:
  - claude
  - codex
includes: auto
dependencies:
  apm:
    - JoeFwd/bannerlord-agent#v0.2.1
  mcp:
    # Copied from bannerlord-agent's apm.yml: APM skips MCP servers declared two packages deep,
    # so this layer re-declares them for the projects that depend on it. Keep in sync on bumps.
    - name: bannerlord-search-1_2_12
      registry: false
      transport: stdio
      command: uv
      args:
        - run
        - --isolated
        - --no-project
        - apm_modules/JoeFwd/bannerlord-agent/.apm/mcp/mcp-http-stdio-bridge.py
        - --url
        - http://localhost:5000
    - name: bannerlord-search-1_3_15
      registry: false
      transport: stdio
      command: uv
      args:
        - run
        - --isolated
        - --no-project
        - apm_modules/JoeFwd/bannerlord-agent/.apm/mcp/mcp-http-stdio-bridge.py
        - --url
        - http://localhost:5001
    - name: bannerlord-search-1_4_8
      registry: false
      transport: stdio
      command: uv
      args:
        - run
        - --isolated
        - --no-project
        - apm_modules/JoeFwd/bannerlord-agent/.apm/mcp/mcp-http-stdio-bridge.py
        - --url
        - http://localhost:5002
    - name: bannerlord-game-controller
      registry: false
      transport: stdio
      command: uv
      args:
        - run
        - --isolated
        - --no-project
        - apm_modules/JoeFwd/bannerlord-agent/.apm/mcp/mcp-http-stdio-bridge.py
        - --url
        - http://localhost:8080/mcp
    - name: jetbrains-debugger
      registry: false
      transport: stdio
      command: uv
      args:
        - run
        - --isolated
        - --no-project
        - apm_modules/JoeFwd/bannerlord-agent/.apm/mcp/mcp-http-stdio-bridge.py
        - --url
        - http://localhost:29202/debugger-mcp/streamable-http
    - name: music-analysis
      registry: false
      transport: stdio
      command: uvx
      args:
        - --with
        - mcp==1.30.0  # 0.1.0 breaks on mcp 2.x
        - mcp_local_music_analysis@0.1.0
